name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      preRelease:
        description: "Publish as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build-extension
      - run: yarn build-plugins
      - run: yarn test:ai
      - run: yarn test:ai-e2e
      - name: Release check
        run: node scripts/release-check.js --built
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - name: Package
        run: |
          if [ "${{ inputs.preRelease }}" = "true" ]; then
            npx vsce package --yarn --allow-unused-files-pattern --pre-release --out dist/extension.vsix
          else
            npx vsce package --yarn --allow-unused-files-pattern --out dist/extension.vsix
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: drawio-ai-vsix
          path: dist/extension.vsix
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/extension.vsix --title "Draw.io AI $VERSION" --notes-file notes.md
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT secret not set; skipping Marketplace publish."; exit 0; fi
          npx vsce verify-pat "$(node -p "require('./package.json').publisher")"
          npx vsce publish --packagePath dist/extension.vsix ${{ inputs.preRelease && '--pre-release' || '' }}
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT secret not set; skipping Open VSX publish."; exit 0; fi
          npx ovsx publish dist/extension.vsix ${{ inputs.preRelease && '--pre-release' || '' }}
