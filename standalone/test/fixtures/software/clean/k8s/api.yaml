apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: catalog
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/catalog-api:2.3.1
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: api-secrets, key: DB_PASSWORD }
            - name: LOG_LEVEL
              value: info
