name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: acme-tools/setup-thing@0123456789abcdef0123456789abcdef01234567 # v2
      - name: Greet
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Testing $TITLE"
      - run: npm test
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
