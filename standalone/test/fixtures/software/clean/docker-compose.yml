services:
  api:
    build: ./api
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/catalog
      JWT_SECRET: ${JWT_SECRET}
      PARTNER_URL: https://api.partner-catalog.com/v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: catalog
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
