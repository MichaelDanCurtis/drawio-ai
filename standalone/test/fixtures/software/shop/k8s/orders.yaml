apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: shop
data:
  PAYMENTS_URL: https://api.stripe.com
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-secrets
  namespace: shop
data:
  DB_PASSWORD: azhzU2VjcmV0QmFzZTY0
stringData:
  API_TOKEN: k8s-plain-secret-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: orders
          image: ghcr.io/acme/orders:1.4.2
          envFrom:
            - configMapRef: { name: orders-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: orders-secrets, key: DB_PASSWORD }
            - name: ANALYTICS_HOST
              value: analytics.shop.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: shop
spec:
  selector: { app: orders }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service: { name: orders-svc, port: { number: 80 } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: shop
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              image: ghcr.io/acme/orders:1.4.2
              env:
                - name: DATABASE_HOST
                  value: db
          restartPolicy: OnFailure
