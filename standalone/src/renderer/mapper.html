<style nonce="$$nonce$$">
	body { display: flex; flex-direction: column; }
	.head { position: relative; isolation: isolate; flex: none; padding: 22px 24px 16px; border-bottom: 1px solid var(--border); }
	.head > :not(.backdrop) { position: relative; z-index: 1; }
	.head .backdrop { height: 100%; }
	.head .label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
	.head h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; margin: 0 0 6px; }
	.head p { margin: 0; color: var(--muted); max-width: 640px; }
	main { flex: 1; display: grid; grid-template-columns: 196px 236px 1fr; min-height: 0; }
	nav, #recipes { border-right: 1px solid var(--border); overflow: auto; padding: 12px 10px; }
	nav { display: flex; flex-direction: column; gap: 2px; }
	#recipes { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
	.cat { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: var(--ink-2); font: inherit; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
	.cat:hover { background: var(--surface-3); color: var(--ink); }
	.cat.active { background: var(--surface); border-color: var(--border); color: var(--ink); }
	.cat .ico { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: var(--radius); background: var(--surface-3); color: var(--ink-2); }
	.cat.active .ico { background: var(--accent); color: var(--accent-ink); }
	/* a vendor's own logo keeps its colours, on white in both themes */
	.cat .ico.brand, .cat.active .ico.brand { background: #ffffff; border: 1px solid var(--border); }
	.cat .ico.brand img { width: 24px; height: 24px; object-fit: contain; display: block; }
	.cat.active .ico.brand { border-color: var(--ink); }
	.cat small { display: block; color: var(--faint); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.5; }
	.recipe { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); color: inherit; font: inherit; padding: 8px 11px; border-radius: 10px; margin-bottom: 6px; cursor: pointer; animation: rise var(--dur) var(--ease-enter) backwards; transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
	.recipe:nth-child(2) { animation-delay: 30ms; } .recipe:nth-child(3) { animation-delay: 60ms; } .recipe:nth-child(4) { animation-delay: 90ms; } .recipe:nth-child(n + 5) { animation-delay: 120ms; }
	#recipes.settled .recipe { animation: none; }
	.recipe:hover { border-color: var(--control-line); }
	.recipe.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
	.recipe b { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; line-height: 1.3; }
	.recipe > span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.badge { display: inline-flex; padding: 1px 7px; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 9.5px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
	#form { overflow: auto; padding: 20px 24px 24px; }
	#form h2 { font-size: var(--text-heading); font-weight: 500; letter-spacing: -0.01em; margin: 0 0 4px; }
	#form .desc { color: var(--muted); margin: 0 0 18px; max-width: 620px; }
	.field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; max-width: 620px; }
	.field > label:not(.check) { font-family: var(--font-mono); font-size: var(--text-label); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--muted); }
	.field .help { color: var(--faint); font-size: 12px; }
	.row { display: flex; gap: 6px; align-items: center; }
	input[type=text], input[type=password], select, textarea { width: 100%; min-height: 34px; padding: 6px 10px; }
	textarea { min-height: 72px; resize: vertical; font-family: var(--font-mono); font-size: 12px; }
	.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out); }
	.check:hover { border-color: var(--control-line); }
	.check:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
	.check input { margin-top: 3px; }
	.actions { display: flex; gap: 8px; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); max-width: 620px; }
	.safety { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
	#log { margin-top: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 170px; overflow: auto; max-width: 620px; }
	#log:empty { display: none; }
	#log:not(:empty) { padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); }
	#result { margin-top: 14px; padding: 10px 12px; border-radius: 12px; display: none; max-width: 620px; animation: rise var(--dur) var(--ease-enter); }
	#result.ok { display: block; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
	#result.none { display: block; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--ink-2); }
	#result.err { display: block; background: var(--danger-soft); border: 1px solid var(--danger-line); color: var(--danger); white-space: pre-wrap; }
	#result ul { margin: 6px 0 0; padding-left: 18px; color: var(--warn); }
	#result .elsewhere { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
	#result .elsewhere .label { margin-right: 4px; }
	.empty { color: var(--faint); padding: 30px 10px; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
	.err-text { color: var(--danger) !important; }
</style>
</head>
<body>
<header class="head" data-dot-host>
	<div class="backdrop"><canvas class="dotfield" id="field"></canvas></div>
	<span class="label"><span class="brandmark" aria-hidden="true"><i data-on></i><i data-on></i><i data-on></i><i data-on></i><i data-on></i><i data-on></i><i data-on></i><i></i><i data-on></i><i data-on></i><i></i><i></i><i data-signal></i><i></i><i></i><i></i></span>Mapper · read-only</span>
	<h1>Map something</h1>
	<p>Collects facts read-only (nothing in your systems is changed), draws them as a map you can keep or revert, checks its health, and can hand it to your coding agent to complete or dig deeper.</p>
</header>
<main>
	<nav id="cats"></nav>
	<section id="recipes"><div class="empty">Pick what to map.</div></section>
	<section id="form"><div class="empty">Choose a map on the left.</div></section>
</main>
<script type="module" nonce="$$nonce$$">
	import { mountDotField } from "/ui/dots.js";
	import { mountMatrix } from "/ui/matrix.js";
	const field = mountDotField(document.getElementById("field"), { density: 0.45, anchor: "viewport" });
	window.omnidrawMatrix = mountMatrix();
	// the live dot mark in the head
	const mark = document.querySelector(".head .brandmark");
	if (mark && window.DrawAIBrandmark) window.DrawAIBrandmark.mount(mark, { size: 18 });
	window.drawaiPulse = (x = 0.8, y = 0.4) => field?.pulse(x, y);
</script>
<script nonce="$$nonce$$">
(() => {
	const host = window.drawaiMapper;
	const $ = (id) => document.getElementById(id);
	const el = (tag, attrs = {}, ...kids) => {
		const e = document.createElement(tag);
		for (const [k, v] of Object.entries(attrs)) {
			if (v === undefined || v === null || v === false) continue;
			if (k === "class") e.className = v;
			else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
			else if (k === "text") e.textContent = v;
			else e.setAttribute(k, v === true ? "" : v);
		}
		for (const kid of kids.flat()) if (kid !== undefined && kid !== null) e.append(kid);
		return e;
	};
	// Categories show what they are: the vendors' own logos, and drawn icons for the rest.
	const GLYPHS = { software: "code", database: "database", ml: "ml" };
	const BRANDS = window.DrawAIBrands || {};
	let iconStyle = "dots2d";
	function catIcon(id) {
		if (BRANDS[id]) return el("span", { class: "ico brand" }, el("img", { src: BRANDS[id], alt: "" }));
		const ico = el("span", { class: "ico" });
		if (window.DrawAIIcons && GLYPHS[id]) ico.innerHTML = window.DrawAIIcons.svg(GLYPHS[id], iconStyle, { size: 20 });
		return ico;
	}
	const state = { animateRecipes: true, animateForm: true, catalog: null, saved: {}, cwd: "", category: decodeURIComponent(location.hash.slice(1)) || "software", recipeId: null, values: {}, options: {}, optionErrors: {}, loading: {}, asked: {}, running: false };

	const recipes = () => (state.catalog?.recipes ?? []).filter((r) => r.category === state.category);
	const recipe = () => state.catalog?.recipes.find((r) => r.id === state.recipeId);

	/** A field shows when its condition holds and the field it depends on shows too. */
	function visible(r, f, depth = 0) {
		if (!f.showIf) return true;
		const other = r.fields.find((x) => x.id === f.showIf.field);
		if (other && depth < 10 && !visible(r, other, depth + 1)) return false;
		const v = state.values[f.showIf.field] ?? other?.default ?? "";
		return f.showIf.values.includes(String(v));
	}

	function renderCats() {
		const nav = $("cats");
		nav.replaceChildren(
			...state.catalog.categories.map((c) => {
				const count = state.catalog.recipes.filter((r) => r.category === c.id).length;
				return el(
					"button",
					{ class: "cat" + (c.id === state.category ? " active" : ""), title: c.description, onclick: () => selectCategory(c.id) },
					catIcon(c.id),
					el("span", {}, el("span", { text: c.title }), el("small", { text: count ? `${count} map${count === 1 ? "" : "s"}` : "coming soon" }))
				);
			})
		);
	}

	/** A card's title: the name without what the full title adds after ":" or in brackets. */
	function shortTitle(t) {
		return t.split(":")[0].replace(/\s*\(.*\)\s*$/, "").trim() || t;
	}

	function renderRecipes() {
		const list = recipes();
		const box = $("recipes");
		box.classList.toggle("settled", !state.animateRecipes);
		state.animateRecipes = false;
		if (!list.length) {
			box.replaceChildren(el("div", { class: "empty", text: "Nothing here yet." }));
			return;
		}
		box.replaceChildren(
			...list.map((r) =>
				el(
					"button",
					{ class: "recipe" + (r.id === state.recipeId ? " active" : ""), "data-recipe": r.id, onclick: () => selectRecipe(r.id) },
					el("b", {}, shortTitle(r.title), r.mode === "agent" ? el("span", { class: "badge", text: "with agent" }) : null),
					el("span", { text: r.blurb || "" })
				)
			)
		);
	}

	function initialValues(r) {
		const saved = state.saved[r.id] ?? {};
		const v = {};
		for (const f of r.fields) {
			if (saved[f.id] !== undefined && !f.secret && f.type !== "password") v[f.id] = saved[f.id];
			else if (f.default !== undefined) v[f.id] = f.default;
			// Only a required folder starts as the diagram's folder: an optional one is one source among others.
			else if (f.type === "folder" && f.id === "folder" && f.required) v[f.id] = state.cwd;
			else if (f.type === "checkbox") v[f.id] = "false";
			else v[f.id] = "";
		}
		return v;
	}

	/** Asks for a list. (Numbered: an answer to an earlier question, for a choice since changed, is not shown.) */
	function askFor(r, f) {
		const key = r.id + "/" + f.id;
		state.loading[key] = true;
		state.optionErrors[key] = undefined;
		state.asked[key] = (state.asked[key] ?? 0) + 1;
		host.post({ type: "loadOptions", recipeId: r.id, fieldId: f.id, input: { ...state.values }, seq: state.asked[key] });
	}

	/** ↻: the list again. */
	function loadOptions(r, f) {
		askFor(r, f);
		renderForm();
	}

	/** The lists after a choice are forgotten when it changes: they were listed for the old one (subscription → resource groups). */
	function forgetAfter(r, f) {
		for (const g of r.fields.slice(r.fields.indexOf(f) + 1)) {
			if (!g.dynamic) continue;
			const key = r.id + "/" + g.id;
			delete state.options[key];
			state.loading[key] = false;
			state.asked[key] = (state.asked[key] ?? 0) + 1;
		}
	}

	/**
	 * What the form's lists need next. It does not depend on the form being drawn (it is not
	 * redrawn under someone's typing), and goes through the lists on show in their order:
	 * - A list is asked for once the lists before it are there: it may depend on what they chose
	 *   (a project's clusters). A list nobody sees is not asked for: it is not worth a call to a cloud.
	 * - What is chosen is always something the list offers: the first of a list that has just come,
	 *   or nothing when the list is empty (a cluster chosen under another subscription is not left
	 *   behind, unseen, to be mapped). A choice made here forgets the lists after it, like one made by hand.
	 */
	function advance(r) {
		for (const f of r.fields) {
			if (f.type !== "select" || !visible(r, f)) continue;
			const key = r.id + "/" + f.id;
			if (f.dynamic && state.options[key] === undefined) {
				if (!state.loading[key]) askFor(r, f);
				return;
			}
			if (f.dynamic && state.loading[key]) return;
			const opts = f.dynamic ? state.options[key] : f.options ?? [];
			if (opts.some((o) => o.value === (state.values[f.id] ?? ""))) continue;
			const to = opts.length ? opts[0].value : "";
			if ((state.values[f.id] ?? "") === to) continue;
			state.values[f.id] = to;
			if (f.dynamic) forgetAfter(r, f);
		}
	}

	function fieldEl(r, f) {
		const key = r.id + "/" + f.id;
		const set = (value) => {
			state.values[f.id] = value;
			const lists = f.type === "select" && r.fields.slice(r.fields.indexOf(f) + 1).some((g) => g.dynamic);
			if (lists) forgetAfter(r, f);
			if (lists || r.fields.some((g) => g.showIf?.field === f.id)) renderForm();
		};
		let control;
		switch (f.type) {
			case "textarea":
				control = el("textarea", { placeholder: f.placeholder, oninput: (e) => (state.values[f.id] = e.target.value) });
				control.value = state.values[f.id] ?? "";
				break;
			case "checkbox": {
				// Unticked is an explicit "false", so a checkbox that defaults to on can be turned off.
				const cb = el("input", { type: "checkbox", onchange: (e) => set(e.target.checked ? "true" : "false") });
				cb.checked = state.values[f.id] === "true";
				return el("div", { class: "field" }, el("label", { class: "check" }, cb, el("span", {}, f.label, f.help ? el("div", { class: "help", text: f.help }) : null)));
			}
			case "select": {
				const opts = f.dynamic ? state.options[key] ?? [] : f.options ?? [];
				const sel = el("select", { onchange: (e) => set(e.target.value) });
				if (f.dynamic && (state.loading[key] || state.options[key] === undefined)) sel.append(el("option", { value: "", text: "Loading…" }));
				else if (!opts.length) sel.append(el("option", { value: "", text: f.dynamic ? "(none found — refresh or type in settings)" : "" }));
				for (const o of opts) sel.append(el("option", { value: o.value, text: o.label }));
				sel.value = state.values[f.id] ?? "";
				control = f.dynamic
					? el("div", { class: "row" }, sel, el("button", { class: "btn", title: "Reload", onclick: () => loadOptions(r, f), text: "↻" }))
					: sel;
				break;
			}
			case "folder":
			case "file": {
				const input = el("input", { type: "text", placeholder: f.placeholder ?? (f.type === "folder" ? "Folder…" : "File…"), oninput: (e) => (state.values[f.id] = e.target.value) });
				input.value = state.values[f.id] ?? "";
				control = el("div", { class: "row" }, input, el("button", { class: "btn", text: "Choose…", onclick: () => host.post({ type: "pick", fieldId: f.id, kind: f.type, current: state.values[f.id] }) }));
				break;
			}
			default: {
				const input = el("input", {
					type: f.type === "password" || f.secret ? "password" : "text",
					placeholder: f.placeholder,
					autocomplete: "off",
					spellcheck: "false",
					oninput: (e) => (state.values[f.id] = e.target.value),
				});
				input.value = state.values[f.id] ?? "";
				control = input;
			}
		}
		const err = state.optionErrors[key];
		return el(
			"div",
			{ class: "field" },
			el("label", {}, f.label, f.required ? " *" : ""),
			control,
			f.help ? el("div", { class: "help", text: f.help }) : null,
			err ? el("div", { class: "help err-text", text: err }) : null,
			f.secret || f.type === "password" ? el("div", { class: "help", text: "Used for this run only; never stored or sent to the agent." }) : null
		);
	}

	function renderForm() {
		const r = recipe();
		const box = $("form");
		if (!r) {
			box.replaceChildren(el("div", { class: "empty", text: "Choose a map on the left." }));
			return;
		}
		// (the lists move on whether or not the form is redrawn just now)
		advance(r);
		const focus = document.activeElement;
		const keepFocus = focus && box.contains(focus) && (focus.tagName === "INPUT" || focus.tagName === "TEXTAREA");
		// don't re-render under the user's typing: it is drawn when they leave the box
		state.renderDue = !!keepFocus;
		if (keepFocus) return;
		box.classList.toggle("page", !!state.animateForm);
		state.animateForm = false;
		const describe = el("input", { type: "checkbox", id: "describe" });
		describe.checked = !!state.describe;
		describe.addEventListener("change", (e) => (state.describe = e.target.checked));
		const askAgent = el("input", { type: "checkbox", id: "askAgent" });
		askAgent.checked = r.mode === "agent" || !!state.askAgent;
		askAgent.disabled = r.mode === "agent" || !r.canAskAgent;
		askAgent.addEventListener("change", (e) => (state.askAgent = e.target.checked));
		box.replaceChildren(
			el("h2", { text: r.title }),
			el("p", { class: "desc", text: r.description }),
			...r.fields.filter((f) => visible(r, f)).map((f) => fieldEl(r, f)),
			r.canAskAgent || r.mode === "agent"
				? el(
						"div",
						{ class: "field" },
						el(
							"label",
							{ class: "check" },
							askAgent,
							el("span", {}, r.mode === "agent" ? "The agent completes this map in the chat" : "Then ask the agent to review and annotate the map", el("div", { class: "help", text: "It works in the chat, read-only; you approve anything it wants to run." }))
						)
				  )
				: null,
			r.mode !== "agent"
				? el(
						"div",
						{ class: "field" },
						el("label", { class: "check" }, describe, el("span", {}, "Then have the agent describe every shape in plain English", el("div", { class: "help", text: "Shown as each shape's tooltip; the agent works from what the map shows and the files, in the chat." })))
				  )
				: null,
			el(
				"div",
				{ class: "actions" },
				el("span", { id: "status", class: "safety", text: "Read-only: inventory, catalog and file reads only." }),
				el("span", { class: "spacer" }),
				el("button", { class: "btn", id: "cancel", text: state.running ? "Stop" : "Close", onclick: () => host.post({ type: state.running ? "cancel" : "close" }) }),
				el("button", { class: "btn btn-primary", id: "run", text: state.running ? "Mapping…" : "Map it", disabled: state.running, onclick: run })
			),
			el("div", { id: "result" }),
			el("div", { id: "log" })
		);
	}

	function run() {
		const r = recipe();
		if (!r) return;
		const input = {};
		for (const f of r.fields) if (visible(r, f)) input[f.id] = String(state.values[f.id] ?? "");
		host.post({ type: "run", recipeId: r.id, input, askAgent: r.mode === "agent" || !!state.askAgent, describe: !!state.describe });
	}

	function selectCategory(id) {
		if (id !== state.category) { state.animateRecipes = true; window.drawaiPulse?.(); }
		state.category = id;
		const first = recipes()[0];
		if (first && !recipes().some((r) => r.id === state.recipeId)) selectRecipe(first.id, true);
		renderCats();
		renderRecipes();
		renderForm();
	}

	$("form").addEventListener("focusout", () => setTimeout(() => state.renderDue && renderForm()));

	function selectRecipe(id, quiet) {
		if (id !== state.recipeId) state.animateForm = true;
		state.recipeId = id;
		const r = recipe();
		state.values = r ? initialValues(r) : {};
		state.askAgent = false;
		if (!quiet) {
			renderRecipes();
			renderForm();
		}
	}

	function setResult(kind, text, warnings, elsewhere) {
		const box = $("result");
		if (!box) return;
		box.className = kind;
		// (other folders the same map can be made of, e.g. a repository's working copies: one click maps one)
		// (the ones worked in last, and the rest behind a button: none is out of reach)
		const offer = (e) => el("button", { class: "btn btn-sm", text: e.label, title: e.folder, onclick: () => mapFolder(e.folder) });
		const rest = elsewhere?.length > 6 ? el("button", { class: "btn btn-sm btn-ghost", text: (elsewhere.length - 6) + " more…", onclick: () => rest.replaceWith(...elsewhere.slice(6).map(offer)) }) : null;
		const others = elsewhere?.length ? el("div", { class: "elsewhere" }, el("span", { class: "label", text: "Map one instead" }), ...elsewhere.slice(0, 6).map(offer), rest) : null;
		// (only what is there: the DOM writes a missing child out as the word "null")
		box.replaceChildren(...[el("div", { text }), warnings?.length ? el("ul", {}, ...warnings.slice(0, 20).map((w) => el("li", { text: w }))) : null, others].filter(Boolean));
		// (it is below the form: a result nobody sees is a run that seemed to do nothing)
		box.scrollIntoView({ block: "nearest" });
	}

	/** The same map, of another folder. */
	function mapFolder(folder) {
		const r = recipe();
		if (!r || state.running || !r.fields.some((f) => f.id === "folder")) return;
		state.values.folder = folder;
		renderForm();
		run();
	}

	host.onMessage((msg) => {
		switch (msg.type) {
			case "catalog":
				state.catalog = msg.catalog;
				iconStyle = msg.iconStyle || iconStyle;
				document.documentElement.dataset.matrix = msg.matrix || "grey";
				state.saved = msg.saved ?? {};
				state.cwd = msg.cwd ?? "";
				renderCats();
				selectCategory(state.catalog.categories.some((c) => c.id === state.category) ? state.category : "software");
				break;
			case "selectCategory":
				selectCategory(msg.category);
				break;
			case "options": {
				const key = msg.recipeId + "/" + msg.fieldId;
				if (msg.seq !== undefined && msg.seq !== state.asked[key]) break;
				state.loading[key] = false;
				state.options[key] = msg.options ?? [];
				state.optionErrors[key] = msg.error;
				if (msg.recipeId === state.recipeId) renderForm();
				break;
			}
			case "picked":
				state.values[msg.fieldId] = msg.path;
				renderForm();
				break;
			case "running":
				state.running = true;
				renderForm();
				$("status").replaceChildren(el("span", { class: "dot-loader", "aria-hidden": "true" }, el("i"), el("i"), el("i"), el("i"), el("i")), "Mapping…");
				break;
			case "progress": {
				const log = $("log");
				if (log) {
					log.textContent += (log.textContent ? "\n" : "") + msg.text;
					log.scrollTop = log.scrollHeight;
				}
				break;
			}
			case "done":
				state.running = false;
				renderForm();
				// (a run that found nothing to draw is not a success to tick off: it says what it looked at)
				setResult(msg.nothing ? "none" : "ok", (msg.nothing ? "" : "✓ ") + msg.summary, msg.warnings, msg.elsewhere);
				if (!msg.nothing) window.drawaiPulse?.(0.5, 0.5);
				break;
			case "failed":
				state.running = false;
				renderForm();
				setResult("err", msg.message + (msg.hint ? "\n" + msg.hint : ""));
				break;
		}
	});
	host.post({ type: "ready" });
})();
</script>
</body>
</html>
