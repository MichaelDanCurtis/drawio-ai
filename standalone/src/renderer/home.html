<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src $$cspSource$$ data:; font-src $$cspSource$$; style-src 'nonce-$$nonce$$' $$cspSource$$; script-src 'nonce-$$nonce$$' $$cspSource$$;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniDraw</title>
<link rel="stylesheet" nonce="$$nonce$$" href="/ui/fonts.css">
<link rel="stylesheet" nonce="$$nonce$$" href="/ui/tokens.css">
<link rel="stylesheet" nonce="$$nonce$$" href="/ui/motion.css">
<link rel="stylesheet" nonce="$$nonce$$" href="/ui/depth.css">
<link rel="stylesheet" nonce="$$nonce$$" href="/ui/app.css">
<script nonce="$$nonce$$" src="/ui/brandmark.js"></script>
<style nonce="$$nonce$$">
	body { display: flex; overflow: hidden; }
	[hidden] { display: none !important; }

	/* ----- the rail: what to look at ----- */
	.rail { position: relative; isolation: isolate; flex: none; width: var(--sidebar-w); display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg); }
	.rail > :not(.backdrop) { position: relative; z-index: 1; }
	.rail .brand { display: flex; align-items: center; gap: 8px; padding: 20px 18px 14px; }
	.rail .new { display: grid; gap: 6px; padding: 0 14px 14px; }
	.rail .new .btn { justify-content: flex-start; padding-left: 14px; }
	.rail nav { flex: 1; overflow: auto; padding: 4px 8px 8px; }
	.rail .section { display: flex; align-items: center; padding: 14px 10px 6px; }
	.rail .section .icon-btn { width: 24px; height: 24px; margin-left: auto; }
	.nav { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 4px 10px; border: 1px solid transparent; border-radius: var(--radius); background: none; color: var(--ink-2); font: inherit; text-align: left; cursor: pointer; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
	.nav:hover { background: var(--surface-3); color: var(--ink); }
	.nav[aria-current="true"] { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 500; }
	.nav.over { border-color: var(--ink); background: var(--surface); }
	.nav .n { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
	.nav .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.nav svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
	.rail .name-input { margin: 2px 2px 4px; width: calc(100% - 4px); padding: 4px 8px; }
	.rail .foot { flex: none; border-top: 1px solid var(--border); padding: 10px 14px 12px; }
	/* (a long path is cut at its start: its end is what tells one folder from another) */
	.rail .foot .where { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; margin: 4px 0 8px; }
	.rail .foot .row { display: flex; gap: 6px; }

	/* ----- the documents ----- */
	main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
	.bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 18px 22px 12px; }
	.bar h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.bar #count { flex: none; }
	.bar input[type="text"] { width: 200px; padding: 5px 10px; border-radius: var(--radius-pill); }
	.bar select { padding: 5px 8px; border-radius: var(--radius-pill); }
	.scroll { flex: 1; overflow: auto; padding: 4px 22px 28px; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 14px; }
	.doc { position: relative; display: flex; flex-direction: column; overflow: hidden; cursor: default; transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); animation: rise var(--dur) var(--ease-enter) both; }
	.doc:hover { border-color: var(--control-line); }
	.doc:focus-visible { outline-offset: 0; }
	.doc.dragging { opacity: 0.5; }
	.doc .shot { position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center; background: var(--surface-2); border-bottom: 1px solid var(--border); overflow: hidden; }
	/* (a document is drawn on its own paper, whatever the window's theme; the whole of it is in the picture) */
	.doc .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #ffffff; }
	.doc .shot .blank { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
	.doc .meta { padding: 9px 38px 10px 12px; min-width: 0; }
	.doc .name { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.doc .name-input { width: 100%; padding: 2px 6px; margin: -3px -7px; }
	.doc .sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
	.doc .sub .label { font-size: 10px; color: var(--ink-2); }
	.doc .sub .sep { color: var(--faint); }
	.doc .sub .rest { overflow: hidden; text-overflow: ellipsis; }
	.doc .more { position: absolute; right: 5px; bottom: 9px; width: 28px; height: 28px; }
	.doc .open { position: absolute; top: 9px; right: 9px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border-strong); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
	.doc .open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
	.doc .open[data-unsaved]::before { background: var(--signal); }
	.empty { display: grid; place-items: center; min-height: 60%; text-align: center; color: var(--muted); padding: 30px; }
	.empty h2 { font-size: 18px; font-weight: 500; color: var(--ink); margin: 0 0 6px; letter-spacing: -0.01em; }
	.empty p { margin: 0 auto 14px; max-width: 44ch; }
	.empty .row { display: inline-flex; gap: 8px; }
	.more-note { margin-top: 16px; color: var(--muted); font-size: 12px; }

	/* ----- versions of one document ----- */
	.side { flex: none; width: 300px; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--bg); animation: slide var(--dur) var(--ease-enter) both; }
	.side header { display: flex; align-items: flex-start; gap: 8px; padding: 18px 12px 10px 16px; }
	.side header .label { display: block; margin-bottom: 4px; }
	.side header h2 { font-size: 15px; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
	.side .look { position: relative; margin: 0 16px 10px; aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; }
	.side .look img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #ffffff; }
	.side .acts { display: flex; gap: 6px; padding: 0 16px 12px; }
	.side ol { flex: 1; overflow: auto; list-style: none; margin: 0; padding: 0 8px 12px; }
	.side li button { appearance: none; display: block; width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: var(--radius); background: none; color: var(--ink-2); font: inherit; text-align: left; cursor: pointer; }
	.side li button:hover { background: var(--surface-3); }
	.side li button[aria-current="true"] { background: var(--surface); border-color: var(--border); color: var(--ink); }
	.side li .when { display: block; font-weight: 500; }
	.side li .what { display: block; font-size: 12px; color: var(--muted); }
	.side .none { padding: 6px 16px; color: var(--muted); }

	/* ----- what could not be done, said at the bottom ----- */
	#said { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 40px)); z-index: 30; box-shadow: var(--shadow-2); animation: rise var(--dur) var(--ease-enter) both; }
	.menu { position: fixed; z-index: 40; min-width: 190px; max-height: 70vh; overflow: auto; }
	.menu .head { padding: 6px 12px 2px; }
</style>
</head>
<body>
<aside class="rail" data-dot-host>
	<div class="backdrop"><canvas class="dotfield" id="field"></canvas></div>
	<div class="brand"><span class="brandmark" aria-hidden="true"></span><span class="label">OmniDraw</span></div>
	<div class="new">
		<button type="button" class="btn btn-primary" id="newDrawing">New drawing</button>
		<button type="button" class="btn" id="newDiagram">New diagram</button>
	</div>
	<nav id="nav" aria-label="Library"></nav>
	<div class="foot">
		<span class="label">Library folder</span>
		<div class="where" id="where"></div>
		<div class="row">
			<button type="button" class="btn btn-sm" id="showFolder">Show</button>
			<button type="button" class="btn btn-sm" id="chooseFolder">Change…</button>
		</div>
	</div>
</aside>
<main>
	<div class="bar">
		<h1 id="title">All documents</h1>
		<span class="label num" id="count"></span>
		<span class="spacer"></span>
		<input type="text" id="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search by name">
		<select id="sort" aria-label="Order">
			<option value="edited">Last edited</option>
			<option value="name">Name</option>
		</select>
		<button type="button" class="btn btn-ghost" id="openOther">Open file…</button>
		<button type="button" class="btn btn-danger" id="emptyTrash" hidden>Empty Trash</button>
	</div>
	<div class="scroll" id="scroll">
		<div class="callout callout-warn" id="trouble" hidden></div>
		<div class="grid" id="grid"></div>
		<div class="more-note" id="moreNote" hidden>The library has more documents than are shown here. Search by name to find one, or put some in a folder of their own outside the library.</div>
		<div class="empty" id="empty" hidden></div>
	</div>
</main>
<aside class="side" id="side" hidden aria-label="Versions">
	<header>
		<div><span class="label">Versions</span><h2 id="sideName"></h2></div>
		<span class="spacer"></span>
		<button type="button" class="icon-btn" id="sideClose" aria-label="Close versions"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
	</header>
	<div class="look card" id="sideLook"></div>
	<div class="acts">
		<button type="button" class="btn btn-primary btn-sm" id="goBack">Go back to this</button>
		<button type="button" class="btn btn-sm" id="openCopy">Open as a copy</button>
	</div>
	<ol id="versions"></ol>
</aside>
<div class="callout" id="said" hidden role="status"></div>
<script type="module" nonce="$$nonce$$">
	import { mountDotField } from "/ui/dots.js";
	import { mountMatrix } from "/ui/matrix.js";
	mountDotField(document.getElementById("field"), { density: 0.4, anchor: "viewport" });
	window.omnidrawMatrix = mountMatrix();
	const mark = document.querySelector(".rail .brandmark");
	if (mark && window.DrawAIBrandmark) window.DrawAIBrandmark.mount(mark, { size: 18 });
</script>
<script nonce="$$nonce$$">
(() => {
	const host = window.omnidrawHome;
	const $ = (id) => document.getElementById(id);
	const el = (tag, props = {}, ...kids) => {
		const node = document.createElement(tag);
		for (const [k, v] of Object.entries(props)) {
			if (k === "class") node.className = v;
			else if (k === "text") node.textContent = v;
			else if (k.startsWith("data-") || k.startsWith("aria-") || k === "role" || k === "title" || k === "type" || k === "draggable" || k === "tabindex") node.setAttribute(k, v);
			else node[k] = v;
		}
		node.append(...kids.filter((k) => k !== undefined && k !== null));
		return node;
	};
	const icon = (d) => {
		const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
		svg.setAttribute("viewBox", "0 0 16 16");
		svg.setAttribute("fill", "none");
		svg.setAttribute("stroke", "currentColor");
		svg.setAttribute("stroke-width", "1.4");
		svg.setAttribute("stroke-linecap", "round");
		svg.setAttribute("stroke-linejoin", "round");
		const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
		path.setAttribute("d", d);
		svg.append(path);
		return svg;
	};
	const ICONS = {
		all: "M2.5 3.5h4.5v4.5H2.5zM9 3.5h4.5v4.5H9zM2.5 9.5h4.5V13H2.5zM9 9.5h4.5V13H9z",
		recent: "M8 4.5V8l2.2 1.6M13.5 8a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z",
		folder: "M2 4.5h4l1.2 1.5H14v6.5H2z",
		none: "M3 3.5h10v9H3zM3 6.5h10",
		trash: "M3.5 4.5h9M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5",
		plus: "M8 3.5v9M3.5 8h9",
		more: "M4 8h.01M8 8h.01M12 8h.01",
	};

	let state = { docs: [], collections: [], trash: [], recents: [], folder: "" };
	/** What is looked at: all, recent, one collection (or the documents in none), or the trash. */
	let view = { kind: "all" };
	let query = "";
	let sort = "edited";
	/** The document whose versions are shown, the versions, and the one picked. */
	let side;
	/** Pictures asked for and got, by key; and the last one shown for a card, kept while a newer one is on its way. */
	const pictures = new Map();
	const lastShown = new Map();
	/** The name being typed (a new collection, a card's new name): a state that arrives meanwhile does not take it away. */
	let typing;

	const post = (msg) => host.post(msg);

	// ----- words -----

	const KIND = { drawio: "Diagram", excalidraw: "Drawing" };
	function when(at) {
		const s = Math.max(0, (Date.now() - at) / 1000);
		if (s < 50) return "just now";
		if (s < 3600) return `${Math.round(s / 60)} min ago`;
		if (s < 86400) return `${Math.round(s / 3600)} h ago`;
		const days = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(at).setHours(0, 0, 0, 0)) / 86400000);
		if (days === 1) return "yesterday";
		if (days < 7) return `${days} days ago`;
		return new Date(at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
	}
	const exact = (at) => new Date(at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
	const format = (ending) => (/\.(png|svg)$/i.test(ending) ? ending.split(".").pop().toUpperCase() : "");

	// ----- what is listed -----

	function listed() {
		const q = query.trim().toLowerCase();
		const named = (x) => !q || x.name.toLowerCase().includes(q);
		let items;
		if (view.kind === "trash") items = state.trash.filter(named).map((t) => ({ ...t, key: `t:${t.id}`, ask: { trashId: t.id }, at: t.at, trashed: true }));
		else if (view.kind === "recent") items = state.recents.filter(named).map((r) => ({ ...r, key: `r:${r.path}:${r.at}`, ask: { path: r.path }, recent: true }));
		else items = state.docs.filter((d) => named(d) && (view.kind === "all" || d.collection === view.name)).map((d) => ({ ...d, key: `d:${d.id}:${d.modified}:${d.pictured}`, ask: { id: d.id }, at: d.modified }));
		if (sort === "name") items.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true }));
		else items.sort((a, b) => b.at - a.at);
		return items;
	}

	// ----- pictures: asked for when a card comes into view -----

	const seen = new IntersectionObserver((entries) => {
		for (const e of entries) {
			if (!e.isIntersecting) continue;
			seen.unobserve(e.target);
			const key = e.target.dataset.key;
			if (pictures.has(key)) continue;
			pictures.set(key, undefined);
			post({ type: "preview", key, ...JSON.parse(e.target.dataset.ask) });
		}
	}, { root: $("scroll"), rootMargin: "300px" });

	function shot(key, stable, blank) {
		const box = el("div", { class: "shot" });
		const url = pictures.get(key) ?? lastShown.get(stable);
		if (url) box.append(el("img", { src: url, alt: "", draggable: false }));
		else box.append(el("span", { class: "blank", text: pictures.get(key) === null ? blank : "" }));
		return box;
	}

	// ----- the rail -----

	function navButton(label, iconName, current, count, onClick) {
		const b = el("button", { type: "button", class: "nav", "aria-current": String(current) }, icon(ICONS[iconName]), el("span", { class: "t", text: label }), count === undefined ? undefined : el("span", { class: "n", text: String(count) }));
		b.addEventListener("click", onClick);
		return b;
	}

	function dropTarget(button, collection) {
		button.addEventListener("dragover", (e) => {
			if (![...e.dataTransfer.types].includes("application/x-omnidraw-doc")) return;
			e.preventDefault();
			button.classList.add("over");
		});
		button.addEventListener("dragleave", () => button.classList.remove("over"));
		button.addEventListener("drop", (e) => {
			e.preventDefault();
			button.classList.remove("over");
			const id = e.dataTransfer.getData("application/x-omnidraw-doc");
			if (id) post({ type: "move", id, collection });
		});
	}

	function renderNav() {
		if (typing?.where === "nav") return;
		const nav = $("nav");
		const unfiled = state.docs.filter((d) => !d.collection).length;
		const go = (v) => () => {
			view = v;
			closeSide();
			render();
		};
		const kids = [navButton("All documents", "all", view.kind === "all", state.docs.length, go({ kind: "all" })), navButton("Recent", "recent", view.kind === "recent", undefined, go({ kind: "recent" }))];
		const add = el("button", { type: "button", class: "icon-btn", "aria-label": "New collection", title: "New collection" }, icon(ICONS.plus));
		add.addEventListener("click", () => nameCollection());
		kids.push(el("div", { class: "section" }, el("span", { class: "label", text: "Collections" }), add));
		for (const c of state.collections) {
			const b = navButton(c.name, "folder", view.kind === "collection" && view.name === c.name, c.count, go({ kind: "collection", name: c.name }));
			b.dataset.collection = c.name;
			b.addEventListener("contextmenu", (e) => {
				e.preventDefault();
				menu(e.clientX, e.clientY, [
					{ label: "Rename…", run: () => nameCollection(c.name) },
					{ label: "Remove Collection", tone: "danger", run: () => post({ type: "removeCollection", name: c.name }) },
				], c.count ? `Its ${c.count === 1 ? "document stays" : `${c.count} documents stay`} in the library` : undefined);
			});
			dropTarget(b, c.name);
			kids.push(b);
		}
		const none = navButton("In no collection", "none", view.kind === "collection" && view.name === "", unfiled, go({ kind: "collection", name: "" }));
		dropTarget(none, "");
		kids.push(none);
		kids.push(el("div", { class: "section" }));
		kids.push(navButton("Trash", "trash", view.kind === "trash", state.trash.length || undefined, go({ kind: "trash" })));
		nav.replaceChildren(...kids);
	}

	/** A collection's name is typed in the rail: a new one, or another name for one that is there. */
	function nameCollection(existing) {
		const input = el("input", { type: "text", class: "name-input", placeholder: "Collection name", maxLength: 120, value: existing ?? "" });
		typing = { where: "nav" };
		const nav = $("nav");
		const before = existing ? [...nav.querySelectorAll(".nav")].find((b) => b.dataset.collection === existing) : [...nav.querySelectorAll(".nav")].find((b) => b.textContent.startsWith("In no collection"));
		if (existing && before) before.replaceWith(input);
		else nav.insertBefore(input, before ?? null);
		input.focus();
		input.select();
		let done = false;
		const end = (keep) => {
			if (done) return;
			done = true;
			typing = undefined;
			const name = input.value.trim();
			if (keep && name && name !== existing) post(existing ? { type: "renameCollection", name: existing, to: name } : { type: "newCollection", name });
			renderNav();
		};
		input.addEventListener("keydown", (e) => {
			if (e.key === "Enter") end(true);
			else if (e.key === "Escape") end(false);
			e.stopPropagation();
		});
		input.addEventListener("blur", () => end(true));
	}

	// ----- the cards -----

	function card(item) {
		const stable = item.ask.id ?? item.ask.path ?? item.ask.trashId;
		const kind = KIND[item.kind];
		const node = el("article", { class: "doc card", tabindex: "0", "data-key": item.key, "data-ask": JSON.stringify(item.ask), title: item.recent ? item.path : "" });
		node.append(shot(item.key, stable, kind));
		const where = item.trashed ? (item.collection ? `was in ${item.collection}` : "") : item.recent ? item.where : view.kind === "all" && item.collection ? item.collection + (item.within ? ` / ${item.within}` : "") : item.within ?? "";
		const sub = el("div", { class: "sub" }, el("span", { class: "label", text: kind + (format(item.ending) ? ` · ${format(item.ending)}` : "") }), el("span", { class: "sep", text: "·" }), el("span", { class: "rest", title: exact(item.at), text: [item.trashed ? `trashed ${when(item.at)}` : item.recent ? `opened ${when(item.at)}` : when(item.at), where].filter(Boolean).join(" · ") }));
		node.append(el("div", { class: "meta" }, el("div", { class: "name", text: item.name, title: item.name + item.ending }), sub));
		if (item.open) node.append(el("span", { class: "open", ...(item.unsaved ? { "data-unsaved": "" } : {}), title: item.unsaved ? "Open, with changes that are not saved" : "Open in a window", text: "Open" }));
		const more = el("button", { type: "button", class: "icon-btn more", "aria-label": `More for ${item.name}` }, icon(ICONS.more));
		more.addEventListener("click", (e) => {
			e.stopPropagation();
			const r = more.getBoundingClientRect();
			cardMenu(item, node, r.left, r.bottom + 4);
		});
		node.append(more);
		node.addEventListener("contextmenu", (e) => {
			e.preventDefault();
			cardMenu(item, node, e.clientX, e.clientY);
		});
		node.addEventListener("dblclick", (e) => {
			if (!e.target.closest("input, .more")) open(item);
		});
		node.addEventListener("keydown", (e) => {
			if (e.target !== node) return;
			if (e.key === "Enter") open(item);
			else if (e.key === "F2" && item.ask.id) rename(item, node);
			else if ((e.key === "Backspace" || e.key === "Delete") && item.ask.id) post({ type: "trash", id: item.id });
		});
		if (item.ask.id) {
			node.draggable = true;
			node.addEventListener("dragstart", (e) => {
				e.dataTransfer.setData("application/x-omnidraw-doc", item.id);
				e.dataTransfer.effectAllowed = "move";
				node.classList.add("dragging");
			});
			node.addEventListener("dragend", () => node.classList.remove("dragging"));
		}
		seen.observe(node);
		return node;
	}

	function open(item) {
		if (item.trashed) return post({ type: "restore", trashId: item.id });
		post(item.recent ? { type: "openRecent", path: item.path } : { type: "open", id: item.id });
	}

	function rename(item, node) {
		const name = node.querySelector(".name");
		const input = el("input", { type: "text", class: "name-input", maxLength: 120, value: item.name, "aria-label": "Name" });
		typing = { where: "card" };
		name.replaceWith(input);
		input.focus();
		input.select();
		let done = false;
		const end = (keep) => {
			if (done) return;
			done = true;
			typing = undefined;
			const next = input.value.trim();
			if (keep && next && next !== item.name) post({ type: "rename", id: item.id, name: next });
			else render();
		};
		input.addEventListener("keydown", (e) => {
			if (e.key === "Enter") end(true);
			else if (e.key === "Escape") end(false);
			e.stopPropagation();
		});
		input.addEventListener("blur", () => end(true));
	}

	function cardMenu(item, node, x, y) {
		if (item.trashed) {
			return menu(x, y, [
				{ label: "Put Back", run: () => post({ type: "restore", trashId: item.id }) },
				{ separator: true },
				{ label: "Delete for Good…", tone: "danger", run: () => post({ type: "deleteForever", trashId: item.id }) },
			]);
		}
		if (item.recent) {
			return menu(x, y, [
				{ label: "Open", run: () => open(item) },
				{ label: state.mac ? "Show in Finder" : "Show in Folder", run: () => post({ type: "revealRecent", path: item.path }) },
				...(item.id ? [] : [{ label: "Copy into the Library", run: () => post({ type: "addRecent", path: item.path, collection: "" }) }]),
				{ separator: true },
				{ label: "Remove from Recent", run: () => post({ type: "removeRecent", path: item.path }) },
			]);
		}
		const elsewhere = [...state.collections.map((c) => c.name).filter((c) => c !== item.collection), ...(item.collection ? [""] : [])];
		menu(x, y, [
			{ label: "Open", run: () => open(item) },
			{ label: "Rename…", run: () => rename(item, node) },
			{ label: "Duplicate", run: () => post({ type: "duplicate", id: item.id }) },
			{ label: `Versions${item.versions ? ` (${item.versions})` : ""}…`, run: () => openSide(item) },
			{ label: state.mac ? "Show in Finder" : "Show in Folder", run: () => post({ type: "reveal", id: item.id }) },
			...(elsewhere.length ? [{ separator: true }, { head: "Move to" }, ...elsewhere.map((c) => ({ label: c || "No collection", run: () => post({ type: "move", id: item.id, collection: c }) }))] : []),
			{ separator: true },
			{ label: "Move to Trash", tone: "danger", run: () => post({ type: "trash", id: item.id }) },
		]);
	}

	// ----- a menu at a point -----

	let openMenu;
	function closeMenu() {
		openMenu?.remove();
		openMenu = undefined;
	}
	function menu(x, y, items, note) {
		closeMenu();
		const box = el("div", { class: "menu float", role: "menu" });
		for (const item of items) {
			if (item.separator) box.append(el("div", { role: "separator" }));
			else if (item.head) box.append(el("div", { class: "head label", text: item.head }));
			else {
				const b = el("button", { type: "button", role: "menuitem", text: item.label, ...(item.tone ? { "data-tone": item.tone } : {}) });
				b.addEventListener("click", () => {
					closeMenu();
					item.run();
				});
				box.append(b);
			}
		}
		if (note) box.append(el("div", { role: "separator" }), el("div", { class: "head muted", text: note }));
		document.body.append(box);
		const r = box.getBoundingClientRect();
		box.style.left = `${Math.max(8, Math.min(x, innerWidth - r.width - 8))}px`;
		box.style.top = `${Math.max(8, Math.min(y, innerHeight - r.height - 8))}px`;
		openMenu = box;
		box.querySelector("[role=menuitem]")?.focus();
	}
	document.addEventListener("pointerdown", (e) => {
		if (openMenu && !openMenu.contains(e.target)) closeMenu();
	});
	addEventListener("blur", closeMenu);
	addEventListener("resize", closeMenu);

	// ----- versions -----

	function openSide(item) {
		side = { id: item.id, name: item.name + item.ending, versions: undefined, picked: undefined };
		post({ type: "versions", id: item.id });
		renderSide();
	}
	function closeSide() {
		side = undefined;
		renderSide();
	}
	function renderSide() {
		$("side").hidden = !side;
		if (!side) return;
		$("sideName").textContent = side.name;
		const list = side.versions ?? [];
		const picked = list.find((v) => v.key === side.picked);
		$("goBack").disabled = $("openCopy").disabled = !picked;
		const look = $("sideLook");
		const key = picked && `v:${side.id}:${picked.key}`;
		if (key && !pictures.has(key)) {
			pictures.set(key, undefined);
			post({ type: "preview", key, id: side.id, version: picked.key });
		}
		look.replaceChildren(key && pictures.get(key) ? el("img", { src: pictures.get(key), alt: "" }) : el("span", { class: "muted", text: picked ? "" : "Pick a version" }));
		if (side.versions && !list.length) {
			$("versions").replaceChildren(el("li", { class: "none", text: "No earlier versions are kept yet. One is kept when the document is opened here, and as it is saved." }));
			return;
		}
		$("versions").replaceChildren(
			...list.map((v) => {
				const b = el("button", { type: "button", "aria-current": String(v.key === side.picked) }, el("span", { class: "when", text: exact(v.at) }), el("span", { class: "what", text: `${when(v.at)}${v.kept ? " · kept as it was then" : ""}` }));
				b.addEventListener("click", () => {
					side.picked = v.key;
					renderSide();
				});
				return el("li", {}, b);
			})
		);
	}
	$("sideClose").addEventListener("click", closeSide);
	$("goBack").addEventListener("click", () => side?.picked && post({ type: "restoreVersion", id: side.id, key: side.picked }));
	$("openCopy").addEventListener("click", () => side?.picked && post({ type: "openVersion", id: side.id, key: side.picked }));

	// ----- the page -----

	function render() {
		document.documentElement.dataset.matrix = state.matrix || "grey";
		renderNav();
		// (the mark keeps the path reading left to right where the line itself is cut from the left)
		$("where").textContent = `\u200e${state.folder}`;
		$("where").title = state.folder;
		$("trouble").hidden = !state.problem;
		$("trouble").textContent = state.problem ?? "";
		const collection = view.kind === "collection";
		if (collection && view.name && !state.collections.some((c) => c.name === view.name)) view = { kind: "all" };
		$("title").textContent = view.kind === "all" ? "All documents" : view.kind === "recent" ? "Recent" : view.kind === "trash" ? "Trash" : view.name || "In no collection";
		const items = listed();
		$("count").textContent = items.length ? String(items.length) : "";
		$("emptyTrash").hidden = view.kind !== "trash" || !state.trash.length;
		$("openOther").hidden = view.kind === "trash";
		$("moreNote").hidden = !(state.more && view.kind !== "trash" && view.kind !== "recent");
		if (typing?.where !== "card") {
			seen.disconnect();
			$("grid").replaceChildren(...items.map(card));
		}
		const empty = $("empty");
		empty.hidden = items.length > 0;
		if (!items.length) {
			const [head, text] = query.trim()
				? ["Nothing by that name", "No document here has those letters in its name."]
				: view.kind === "trash"
				? ["The trash is empty", "A document moved to the trash stays here, with its versions, until you delete it for good."]
				: view.kind === "recent"
				? ["Nothing opened yet", "Diagrams and drawings you open are listed here, wherever they are kept."]
				: collection && view.name
				? ["Nothing in this collection", "Drag a document here from another view, or make a new one: it starts in this collection."]
				: ["Your library is empty", "Make a drawing or a diagram: it is kept in the library folder, with its earlier versions. Files you have elsewhere open as always."];
			const row = el("div", { class: "row" });
			if (!query.trim() && view.kind !== "trash" && view.kind !== "recent") {
				const a = el("button", { type: "button", class: "btn btn-primary", text: "New drawing" });
				a.addEventListener("click", () => create("excalidraw"));
				const b = el("button", { type: "button", class: "btn", text: "New diagram" });
				b.addEventListener("click", () => create("drawio"));
				row.append(a, b);
			}
			empty.replaceChildren(el("div", {}, el("h2", { text: head }), el("p", { text }), row));
		}
		if (side && !state.docs.some((d) => d.id === side.id)) closeSide();
	}

	const create = (kind) => post({ type: "new", kind, collection: view.kind === "collection" ? view.name : "" });
	$("newDrawing").addEventListener("click", () => create("excalidraw"));
	$("newDiagram").addEventListener("click", () => create("drawio"));
	$("openOther").addEventListener("click", () => post({ type: "openOther" }));
	$("emptyTrash").addEventListener("click", () => post({ type: "emptyTrash" }));
	$("showFolder").addEventListener("click", () => post({ type: "revealLibrary" }));
	$("chooseFolder").addEventListener("click", () => post({ type: "chooseFolder" }));
	$("search").addEventListener("input", (e) => {
		query = e.target.value;
		render();
	});
	$("sort").addEventListener("change", (e) => {
		sort = e.target.value;
		render();
	});
	addEventListener("keydown", (e) => {
		if (e.key === "Escape") {
			if (openMenu) closeMenu();
			else if (side) closeSide();
		} else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
			e.preventDefault();
			$("search").focus();
			$("search").select();
		}
	});

	let saidTimer;
	let saidAt = 0;
	function say(text, tone) {
		const box = $("said");
		box.className = `callout${tone ? ` callout-${tone}` : ""}`;
		box.textContent = text;
		box.hidden = false;
		saidAt = Date.now();
		clearTimeout(saidTimer);
		saidTimer = setTimeout(() => (box.hidden = true), 7000);
	}
	$("said").addEventListener("click", () => ($("said").hidden = true));
	// (a window that was behind others keeps poor time: what was said long ago is not still being said when it comes back)
	addEventListener("focus", () => {
		if (Date.now() - saidAt > 7000) $("said").hidden = true;
	});

	host.onMessage((msg) => {
		if (msg.type === "state") {
			state = msg;
			// (pictures of what is no longer listed are let go)
			const keep = new Set([...state.docs.map((d) => `d:${d.id}:${d.modified}:${d.pictured}`), ...state.trash.map((t) => `t:${t.id}`), ...state.recents.map((r) => `r:${r.path}:${r.at}`)]);
			for (const key of pictures.keys()) if (!keep.has(key) && !key.startsWith("v:")) pictures.delete(key);
			render();
		} else if (msg.type === "preview") {
			pictures.set(msg.key, msg.url ?? null);
			if (msg.key.startsWith("v:")) return renderSide();
			const node = [...$("grid").children].find((n) => n.dataset.key === msg.key);
			if (!node) return;
			const ask = JSON.parse(node.dataset.ask);
			const stable = ask.id ?? ask.path ?? ask.trashId;
			if (msg.url) lastShown.set(stable, msg.url);
			else lastShown.delete(stable);
			node.querySelector(".shot").replaceWith(shot(msg.key, stable, node.querySelector(".sub .label").textContent.split(" ·")[0]));
		} else if (msg.type === "versions") {
			if (side && side.id === msg.id) {
				side.versions = msg.versions;
				if (!msg.versions.some((v) => v.key === side.picked)) side.picked = msg.versions[0]?.key;
				renderSide();
			}
		} else if (msg.type === "collectionRenamed") {
			if (view.kind === "collection" && view.name === msg.from) view = { kind: "collection", name: msg.to };
		} else if (msg.type === "problem") say(msg.text, "danger");
		else if (msg.type === "note") say(msg.text);
	});
	// (times said as "3 min ago" go on being right)
	setInterval(() => {
		if (!typing && !openMenu && document.visibilityState === "visible") render();
	}, 60000);
	post({ type: "ready" });
})();
</script>
</body>
</html>
